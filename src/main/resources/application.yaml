spring:
  application:
    name: ranaswanu
  profiles:
    default: local   # loads application-local.yaml when running on your PC; Heroku uses "prod" (see Procfile)
  datasource:
    # Heroku: set DB_URL in Config Vars. Local default keeps working on your PC.
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=runaswanna;encrypt=true;trustServerCertificate=true;}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ranaswanu.co@gmail.com}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart: # Max file size Spring will accept
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}                  # Heroku gives the port in $PORT
  forward-headers-strategy: framework # Heroku router terminates HTTPS

app:
  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:ranaswanu.co@gmail.com}}
  upload:
    dir: uploads  # not used for new uploads any more (they are stored in the database); kept for old code

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  health:
    mail:
      enabled: false
