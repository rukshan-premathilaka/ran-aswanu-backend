spring:
  application:
    name: ranaswanu
  profiles:
    default: local   # loads application-local.yaml (your own file, not in Git)
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=runaswanna;encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ranaswanu.co@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart: # Max file size Spring will accept
      max-file-size: 5MB
      max-request-size: 5MB

app:
  frontend:
    reset-password-url: http://localhost:5173/reset-password

  upload:
    dir: uploads  # uploaded files are physically stored on disk

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000