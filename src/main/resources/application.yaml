spring:
  application:
    name: ranaswanu
  profiles:
    default: local   # loads application-local.yaml when running on your PC; Heroku uses "prod" (see Procfile)
  datasource:
    # Heroku Postgres: the heroku/java buildpack sets JDBC_DATABASE_URL / _USERNAME / _PASSWORD for you.
    # Locally you can set DB_URL / DB_USERNAME / DB_PASSWORD (or use application-local.yaml).
    url: ${DB_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ranaswanu}}
    username: ${DB_USERNAME:${JDBC_DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${JDBC_DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # store all times in UTC (Heroku Postgres is UTC)
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ranaswanu.co@gmail.com}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart: # Max file size Spring will accept
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}                  # Heroku gives the port in $PORT
  forward-headers-strategy: framework # Heroku router terminates HTTPS

app:
  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:ranaswanu.co@gmail.com}}
  upload:
    dir: uploads  # not used for new uploads any more (they are stored in the database); kept for old code

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  health:
    mail:
      enabled: false
